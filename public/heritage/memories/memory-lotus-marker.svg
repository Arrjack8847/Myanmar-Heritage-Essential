<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" width="160" height="180" fill="none" role="img" aria-labelledby="jnw01-mlm-title jnw01-mlm-desc" stroke-linecap="round" stroke-linejoin="round">
  <title id="jnw01-mlm-title">Royal Lotus Timeline Milestone Marker</title>
  <desc id="jnw01-mlm-desc">Symmetrical Myanmar-inspired five-petal lotus jewel in finely engraved champagne-gold metalwork, with aligned connection jewels above and below for a flowing wedding timeline.</desc>
  <defs>
    <linearGradient id="jnw01-mlm-petal-metal" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#FFF0D5"/>
      <stop offset="0.38" stop-color="#E9D0A2"/>
      <stop offset="0.73" stop-color="#D5B47D"/>
      <stop offset="1" stop-color="#B28B55"/>
    </linearGradient>
    <linearGradient id="jnw01-mlm-heart-metal" x1="0.12" y1="0" x2="0.86" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#FFECC7"/>
      <stop offset="0.48" stop-color="#E6C996"/>
      <stop offset="1" stop-color="#B58E58"/>
    </linearGradient>
    <linearGradient id="jnw01-mlm-jewel-metal" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#F6E2BE"/>
      <stop offset="0.48" stop-color="#C9A46B"/>
      <stop offset="1" stop-color="#947143"/>
    </linearGradient>
  </defs>

