    <path d="M80 43.7V52.5" stroke="#B99556" stroke-width="1.85"/>
    <path d="M80 49.2C77.3 46 75 46.8 74.2 49.5M80 49.2C82.7 46 85 46.8 85.8 49.5" stroke="#C3A16A" stroke-width="1.25"/>
  </g>

