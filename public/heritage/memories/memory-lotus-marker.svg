    <path d="M51.4 109.9C43.5 103.4 35.3 101.2 28.7 105.5C25.2 107.8 25.4 112.5 29.4 114.1C33.1 115.6 35.9 113.2 35.5 110.7" stroke="#B58F56" stroke-width="1.65"/>
