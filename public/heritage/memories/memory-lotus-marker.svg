    <path d="M80 68.7V111.3" stroke="#AC824B" stroke-width="1.15"/>
    <path d="M80 80.8C77.7 76.8 75.9 74.8 74.8 72.9M80 88.6C83.2 82.6 84 80.5 85.2 77.5M80 96.5C77.9 92.9 76.4 90.4 75.6 87.9M80 103.7C82.5 100.5 83.7 98.2 84.4 95.8" stroke="#B48C53" stroke-width="0.95"/>
    <path d="M77.2 92.2L80 96.4L82.8 92.2M77.9 102.4L80 105.8L82.1 102.4" stroke="#FAE8C5" stroke-width="0.8"/>
