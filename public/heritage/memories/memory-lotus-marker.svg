    <path d="M80 146.2C77 142.5 73.6 143.2 72.8 146.7M80 146.2C83 142.5 86.4 143.2 87.2 146.7" stroke="#C4A06A" stroke-width="1.3"/>
    <path d="M80 147L76.7 152.2L80 157.2L83.3 152.2L80 147Z" fill="url(#jnw01-mlm-jewel-metal)" stroke="#9C7745" stroke-width="1.2"/>
